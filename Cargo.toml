[workspace]
resolver = "3"
members = ["crates/core", "crates/doctor", "crates/fixtures", "crates/audit", "crates/plan", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/klafkoff/tsync"

[workspace.dependencies]
thiserror = "2"
proptest = "1"
clap = { version = "4", features = ["derive"] }
sha1 = "0.10"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
