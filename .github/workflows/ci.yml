name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-public-tree.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # Transfer tests invoke GNU rsync. macOS runners ship openrsync
      # at /usr/bin/rsync; brew's prefix is the one that must win.
      - name: GNU rsync
        if: runner.os == 'macOS'
        run: |
          brew install rsync
          PREFIX="$(brew --prefix)"
          echo "${PREFIX}/bin" >> "$GITHUB_PATH"
          echo "TSYNC_RSYNC=${PREFIX}/bin/rsync" >> "$GITHUB_ENV"
          "${PREFIX}/bin/rsync" --version
          "${PREFIX}/bin/rsync" --info=help >/dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --workspace
