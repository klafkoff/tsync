[package]
name = "tsync"
description = "Move a torrent library between machines without re-downloading it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "tsync"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tsync-core = { path = "../core" }
tsync-audit = { path = "../audit" }
tsync-doctor = { path = "../doctor" }
tsync-plan = { path = "../plan" }
tsync-rewrite = { path = "../rewrite" }
tsync-transfer = { path = "../transfer" }
tsync-qbt = { path = "../qbt" }
tsync-import = { path = "../import" }
tsync-verify = { path = "../verify" }
tsync-handoff = { path = "../handoff" }
tsync-fetch = { path = "../fetch" }
tsync-migrate = { path = "../migrate" }

[lints]
workspace = true
